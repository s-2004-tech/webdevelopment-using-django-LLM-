<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<title>{% block title %}SmartQA{% endblock %}</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet"> <!-- Bootstrap Icons -->

{% load static %}

<link rel="stylesheet" href="{% static 'css/style.css' %}">

<style>

/* Dark/Light Mode Toggle */

body {

transition: background-color 0.3s, color 0.3s;

}

.dark-mode {

background-color: #121212;

color: #ffffff;

}

.light-mode {

background-color: #ffffff;

color: #000000;

}


/* Text Animation on Load */

.fade-in {

animation: fadeIn 1s ease-out;

}


@keyframes fadeIn {

0% {

opacity: 0;

}

100% {

opacity: 1;

}

}


/* Navbar Hover Effect */

.navbar-nav .nav-link:hover {

background-color: rgba(255, 255, 255, 0.2);

border-radius: 5px;

}


/* Chat-style Display */

.chat-container {

display: flex;

flex-direction: column;

gap: 10px;

}


.chat-bubble {

max-width: 60%;

padding: 10px;

border-radius: 15px;

}


.user {

align-self: flex-start;

background-color: #f1f1f1;

}
.bot {

align-self: flex-end;

background-color: #007bff;

color: white;

}


/* Responsive Layout */

@media (max-width: 768px) {

.container {

padding-top: 120px; /* For mobile view, to ensure the navbar doesn't overlap */

}

}

</style>

</head>

<body class="light-mode">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top shadow-sm">

<div class="container">

<a class="navbar-brand fs-4" href="{% url 'upload' %}">🧠 SmartQA</a>

<button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">

<span class="navbar-toggler-icon"></span>

</button>

<div class="collapse navbar-collapse justify-content-end" id="navbarNav">

<ul class="navbar-nav">

{% if user.is_authenticated %}

<li class="nav-item"><a class="nav-link" href="{% url 'upload' %}"><i class="bi bi-upload"></i> Upload</a></li>

<li class="nav-item"><a class="nav-link" href="{% url 'history' %}"><i class="bi bi-clock-history"></i> History</a></li>

<li class="nav-item"><a class="nav-link" href="{% url 'logout' %}"><i class="bi bi-box-arrow-right"></i> Logout</a></li>

{% else %}

<li class="nav-item"><a class="nav-link" href="{% url 'login' %}"><i class="bi bi-person-circle"></i> Login</a></li>

<li class="nav-item"><a class="nav-link" href="{% url 'register' %}"><i class="bi bi-person-plus-fill"></i> Register</a></li>

{% endif %}

</ul>

</div>

</div>

</nav>


<!-- Dark/Light Mode Toggle Button -->

<div class="text-center mt-5 pt-5">

<button id="toggle-mode" class="btn btn-outline-primary">Switch to Dark Mode</button>

</div>


<div class="container pt-5 mt-4 fade-in">

{% block content %}{% endblock %}

</div>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script>

// Toggle Dark/Light Mode

const toggleButton = document.getElementById('toggle-mode');

const body = document.body;


toggleButton.addEventListener('click', () => {

if (body.classList.contains('light-mode')) {

body.classList.remove('light-mode');

body.classList.add('dark-mode');

toggleButton.textContent = "Switch to Light Mode";

} else {
    body.classList.remove('dark-mode');

body.classList.add('light-mode');

toggleButton.textContent = "Switch to Dark Mode";

}

});

</script>

</body>

</html>
